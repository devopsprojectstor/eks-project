name: Build and deploy to EKS

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "k8s/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  id-token: write   # needed for OIDC login to AWS
  contents: read

concurrency:
  group: deploy-eks
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  EKS_CLUSTER: ${{ vars.EKS_CLUSTER }}
  ECR_BACKEND: ${{ vars.ECR_BACKEND }}
  ECR_FRONTEND: ${{ vars.ECR_FRONTEND }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements-dev.txt
      - run: pytest -q backend/tests

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image names
        run: |
          TAG="${GITHUB_SHA::7}"
          REGISTRY="${{ steps.ecr.outputs.registry }}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "BACKEND_IMAGE=$REGISTRY/$ECR_BACKEND:$TAG" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=$REGISTRY/$ECR_FRONTEND:$TAG" >> "$GITHUB_ENV"

      - name: Build and push backend
        run: |
          docker build --build-arg APP_VERSION="$TAG" -t "$BACKEND_IMAGE" ./backend
          docker push "$BACKEND_IMAGE"

      - name: Build and push frontend
        run: |
          docker build -t "$FRONTEND_IMAGE" ./frontend
          docker push "$FRONTEND_IMAGE"

      - name: Configure kubectl
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER"

      - name: Deploy backend (tier 2) first
        run: |
          kubectl apply -f k8s/namespace.yaml
          sed "s|BACKEND_IMAGE|$BACKEND_IMAGE|" k8s/backend.yaml | kubectl apply -f -
          kubectl rollout status deployment/backend -n two-tier --timeout=180s

      - name: Deploy frontend (tier 1)
        run: |
          sed "s|FRONTEND_IMAGE|$FRONTEND_IMAGE|" k8s/frontend.yaml | kubectl apply -f -
          kubectl rollout status deployment/frontend -n two-tier --timeout=180s

      - name: Show app URL
        run: |
          for i in $(seq 1 30); do
            HOST=$(kubectl get svc frontend -n two-tier -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
            [ -n "$HOST" ] && break
            sleep 10
          done
          echo "App URL: http://$HOST (DNS can take 2-3 minutes to resolve the first time)"
          echo "### App URL: http://$HOST" >> "$GITHUB_STEP_SUMMARY"
