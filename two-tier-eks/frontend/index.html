<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #EEF2F5;
      --surface: #FFFFFF;
      --ink: #1B2A38;
      --muted: #607080;
      --line: #C9D3DC;
      --steel: #2F5D8A;
      --signal: #E8A317;
      --danger: #A8322D;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #141C24; --surface: #1C2630; --ink: #E3E9EE; --muted: #93A2B0;
        --line: #33414E; --steel: #7FA8D1; --signal: #F0B840; --danger: #E07A73;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--paper); color: var(--ink);
      font: 16px/1.5 "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { max-width: 640px; margin: 0 auto; padding: 40px 20px 64px; }

    /* The one loud element: which pod answered this request */
    .served {
      border-left: 6px solid var(--signal);
      background: var(--surface);
      padding: 18px 20px;
      margin-bottom: 36px;
    }
    .served p { margin: 0; color: var(--muted); font-size: 14px; }
    .served strong {
      display: block; font-size: 26px; font-weight: 600; color: var(--ink);
      word-break: break-all; margin: 2px 0 6px;
    }
    .served-row { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; }

    h1 { font-size: 22px; font-weight: 600; margin: 0 0 16px; }

    form { display: flex; gap: 8px; margin-bottom: 20px; }
    input[type=text] {
      flex: 1; min-width: 0; padding: 10px 12px; font: inherit; color: var(--ink);
      background: var(--surface); border: 1px solid var(--line); border-radius: 4px;
    }
    button {
      font: inherit; font-weight: 500; cursor: pointer; border-radius: 4px;
      padding: 10px 16px; border: 1px solid var(--steel); background: var(--steel); color: #fff;
    }
    button.quiet { background: transparent; color: var(--steel); padding: 6px 10px; font-size: 14px; }
    button.delete { background: transparent; border-color: transparent; color: var(--danger); padding: 4px 8px; font-size: 14px; }
    :focus-visible { outline: 3px solid var(--signal); outline-offset: 2px; }

    ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
    li { display: flex; align-items: center; gap: 12px; padding: 12px 2px; border-bottom: 1px solid var(--line); }
    li label { flex: 1; display: flex; gap: 12px; align-items: center; cursor: pointer; }
    li input { width: 18px; height: 18px; accent-color: var(--steel); }
    li.done span { color: var(--muted); text-decoration: line-through; }

    .note { color: var(--muted); padding: 16px 0; margin: 0; }
    .error { color: var(--danger); }
    code { font-size: 14px; }
  </style>
</head>
<body>
<main>
  <section class="served" aria-live="polite">
    <div class="served-row">
      <div>
        <p>This request was answered by backend pod</p>
        <strong id="pod">checking…</strong>
        <p id="meta"></p>
      </div>
      <button class="quiet" id="refresh" type="button">Check again</button>
    </div>
  </section>

  <h1>Task board</h1>
  <form id="add">
    <label for="title" hidden>New task</label>
    <input id="title" type="text" maxlength="120" placeholder="e.g. Add HPA to backend" required>
    <button type="submit">Add task</button>
  </form>

  <p class="note error" id="error" hidden></p>
  <ul id="list"></ul>
  <p class="note" id="empty" hidden>No tasks yet. Add one to confirm the frontend can save data through the backend.</p>
</main>

<script>
  const $ = (id) => document.getElementById(id);

  async function api(path, options = {}) {
    const res = await fetch(`/api${path}`, {
      headers: { "Content-Type": "application/json" }, ...options
    });
    if (!res.ok && res.status !== 204) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.error || `Backend returned ${res.status}`);
    }
    return res.status === 204 ? null : res.json();
  }

  function showError(err) {
    $("error").hidden = false;
    $("error").textContent =
      `Can't reach the backend (${err.message}). Check it with: kubectl get pods -n two-tier`;
  }

  async function loadInfo() {
    try {
      const info = await api("/info");
      $("pod").textContent = info.pod;
      $("meta").textContent = `Version ${info.version}, up for ${info.uptime_seconds}s`;
    } catch (err) {
      $("pod").textContent = "unreachable";
      $("meta").textContent = "";
      showError(err);
    }
  }

  async function loadTasks() {
    try {
      const tasks = await api("/tasks");
      $("error").hidden = true;
      $("empty").hidden = tasks.length > 0;
      $("list").replaceChildren(...tasks.map(renderTask));
    } catch (err) { showError(err); }
  }

  function renderTask(task) {
    const li = document.createElement("li");
    li.className = task.done ? "done" : "";

    const label = document.createElement("label");
    const box = document.createElement("input");
    box.type = "checkbox";
    box.checked = task.done;
    box.addEventListener("change", async () => {
      await api(`/tasks/${task.id}`, { method: "PATCH" }).catch(showError);
      loadTasks();
    });
    const text = document.createElement("span");
    text.textContent = task.title;
    label.append(box, text);

    const del = document.createElement("button");
    del.className = "delete";
    del.type = "button";
    del.textContent = "Delete";
    del.setAttribute("aria-label", `Delete ${task.title}`);
    del.addEventListener("click", async () => {
      await api(`/tasks/${task.id}`, { method: "DELETE" }).catch(showError);
      loadTasks();
    });

    li.append(label, del);
    return li;
  }

  $("add").addEventListener("submit", async (e) => {
    e.preventDefault();
    const title = $("title").value.trim();
    if (!title) return;
    try {
      await api("/tasks", { method: "POST", body: JSON.stringify({ title }) });
      $("title").value = "";
      loadTasks();
    } catch (err) { showError(err); }
  });

  $("refresh").addEventListener("click", loadInfo);
  loadInfo();
  loadTasks();
</script>
</body>
</html>
