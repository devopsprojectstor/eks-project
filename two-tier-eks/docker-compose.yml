# Local run of both tiers:  docker compose up --build  ->  http://localhost:8080
services:
  backend:
    build:
      context: ./backend
      args:
        APP_VERSION: local
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:5000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 3

  frontend:
    build: ./frontend
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
