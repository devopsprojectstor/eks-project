apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: two-tier
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: frontend
          image: FRONTEND_IMAGE  # replaced by the GitHub Actions deploy workflow
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: two-tier
spec:
  type: LoadBalancer     # EKS provisions an AWS load balancer in the public subnets
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 8080
