name: Terraform

on:
  pull_request:
    paths: ["eks/**", "platform/**", ".github/workflows/terraform.yml"]
  push:
    branches: [main]
    paths: ["eks/**", "platform/**", ".github/workflows/terraform.yml"]
  workflow_dispatch:   # "spin the cluster up" button

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: terraform-eks
  cancel-in-progress: false

env:
  ARGOCD_VERSION: v3.4.9

defaults:
  run:
    working-directory: eks

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "^1.10.0"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: terraform fmt -check -recursive
      - run: terraform init -backend-config=backend.hcl -input=false
      - run: terraform validate
      - name: Plan
        run: |
          terraform plan -input=false -no-color -lock=false | tee plan.txt
          {
            echo '### Terraform plan'
            echo '```'
            tail -c 60000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "^1.10.0"
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: terraform init -backend-config=backend.hcl -input=false
      - run: terraform apply -input=false -auto-approve

      - name: Connect kubectl
        run: aws eks update-kubeconfig --region "${{ vars.AWS_REGION }}" --name "${{ vars.EKS_CLUSTER }}"

      - name: Create app namespace
        run: kubectl apply -f ../platform/namespace.yaml

      - name: Install Argo CD
        run: |
          kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
          # Server-side apply: the Argo CD CRDs are too big for client-side apply
          kubectl apply -n argocd --server-side --force-conflicts \
            -f "https://raw.githubusercontent.com/argoproj/argo-cd/${ARGOCD_VERSION}/manifests/install.yaml"
          kubectl wait -n argocd --for=condition=Available deployment --all --timeout=300s

      - name: Register the app with Argo CD
        run: kubectl apply -f ../platform/application.yaml

      - name: Output settings for the app repo
        run: |
          echo '### Settings for the app repo (same values every rebuild)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          terraform output -json app_repo_settings >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
